# Runs the ledger locally with one command: `docker compose up --build`.
# PostgreSQL (the ledger's source of truth) + the FastAPI service in front of it.
# The locust load tester is only started on request: docker compose --profile loadtest run --rm locust

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # ${VAR:-default}: use the value from .env if present, otherwise the default.
      POSTGRES_USER: ${POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger}
      POSTGRES_DB: ${POSTGRES_DB:-ledger}
    ports:
      - "5434:5432"  # 5434 on your Mac, so it won't clash with Project 1 (5433) or a local 5432
    volumes:
      - pgdata:/var/lib/postgresql/data                  # survives `down`, wiped by `down -v`
      - ./db/create_test_db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro  # first start only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledger} -d ${POSTGRES_DB:-ledger}"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy  # the API creates its tables at startup, so wait for the DB
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ledger}:${POSTGRES_PASSWORD:-ledger}@postgres:5432/${POSTGRES_DB:-ledger}
      RATE_LIMIT_PER_SEC: ${RATE_LIMIT_PER_SEC:-50}  # per client, long-run average
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-100}     # per client, short burst allowance
    ports:
      - "8001:8000"  # http://localhost:8001 (Project 1's API uses 8000)
    healthcheck:
      # The slim image has no curl, so use Python's standard library to call /health.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  locust:
    image: locustio/locust:2.32.4
    profiles: ["loadtest"]  # not started by a plain `docker compose up`
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./loadtest:/mnt/loadtest:ro
      - ./results:/mnt/results       # CSV results land in ./results on your Mac
    # Headless run: 50 users (25 started per second) for 60 s, against the api container.
    # --stop-timeout: at the end, let in-flight requests finish instead of killing them, so every
    # transfer the server commits is also counted by the client.
    command: >-
      -f /mnt/loadtest/locustfile.py --headless --host http://api:8000
      --users ${LOCUST_USERS:-50} --spawn-rate 25 --run-time ${LOCUST_RUN_TIME:-60s}
      --stop-timeout 10s --csv /mnt/results/locust --only-summary

volumes:
  pgdata:
