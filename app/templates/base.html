{# Shared layout for every page: <head>, nav bar and styles. Child pages fill the `title` and
   `content` blocks, so the nav and CSS live in one place. #}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ledger{% endblock %} · Payment ledger</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1d2330; }
    nav { background: #1d2330; padding: 12px 16px; display: flex; gap: 20px; flex-wrap: wrap; }
    nav a { color: #fff; text-decoration: none; font-weight: 600; }
    main { max-width: 1000px; margin: 0 auto; padding: 16px; }
    a { color: #1a56c4; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .card { background: #fff; border-radius: 8px; padding: 14px; box-shadow: 0 1px 2px #0002; }
    .card .label { font-size: 13px; color: #5b6475; }
    .card .value { font-size: 24px; font-weight: 700; margin-top: 4px; }
    .table-wrap { overflow-x: auto; }  /* wide tables scroll inside the box, not the whole page */
    table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 8px; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e3e6eb; white-space: nowrap; }
    th { background: #eef0f4; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .muted { color: #5b6475; font-size: 13px; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-weight: 700; color: #fff; font-size: 13px; }
    .bad { background: #c62828; }
    .ok { background: #2e7d32; }
    .debit { color: #c62828; font-weight: 600; }
    .credit { color: #2e7d32; font-weight: 600; }
    .error { background: #fdecea; border: 1px solid #c62828; padding: 10px; border-radius: 6px; }
    .notice { background: #fff8e1; border: 1px solid #f9a825; padding: 10px; border-radius: 6px; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;
           background: #fff; padding: 14px; border-radius: 8px; box-shadow: 0 1px 2px #0002; }
    label { display: flex; flex-direction: column; font-size: 13px; color: #5b6475; gap: 4px; }
    input { padding: 8px; font-size: 15px; border: 1px solid #c5cad3; border-radius: 6px; }
    button, .button { padding: 10px 14px; font-size: 15px; font-weight: 600; background: #1d2330;
             color: #fff; border: 0; border-radius: 6px; cursor: pointer; align-self: end;
             text-decoration: none; display: inline-block; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Accounts</a>
    <a href="/ui/send">Send money</a>
    <a href="/docs">API docs</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
